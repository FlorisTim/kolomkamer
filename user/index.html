<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/loginstyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <script src="/api.js"></script>
    <script src="script.js"></script>
</head>
<body>
<h1 class="centertext">Dashboard</h1>
<div class="row">
<div class="center">
    <div class="centertext title">Columns</div><br>
    <div class="center gray column scroll" id="projects">
        [No Columns]
    </div>
    <div class="center gray column" id="thumbnail">
        <span class="centertext">Click on a column name to view.</span>
    </div>
    <div class="center gray column">
        <span class="centertext">New column</span>
        <input type="text" placeholder="Column name" id="kolom"></input>
        <span id="errortext"></span>
        <button class="centertext" onclick="createFile(document.getElementById('kolom').value)" id="crclmn">Create Column</button>
    </div>
</div>

<div class="center">
    <div class="centertext title">Profile</div><br>
    <div class="center gray column">
        [No Tokens]
    </div>
    <div class="center gray column">

    </div>

</div>
</div>
</body>
<style>
    body {
        background-image: url(../images/background.png);
        background-repeat: no-repeat;
        background-size: 70vw 80vh;
    }

</style>
</html>
